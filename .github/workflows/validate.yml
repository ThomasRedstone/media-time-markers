name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix scripts
      - run: node scripts/validate.js
