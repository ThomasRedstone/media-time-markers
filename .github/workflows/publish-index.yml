name: Publish index

# Rebuilds index/markers-index.json after data/ changes land on main, and
# commits the result straight back. Fine as a direct-to-main commit while
# this repo has a single maintainer; revisit (e.g. open a PR instead) if
# that changes.
on:
  push:
    branches: [main]
    paths:
      - "data/**"

permissions:
  contents: write

jobs:
  publish-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix scripts
      - run: node scripts/validate.js
      - name: Build index
        env:
          BUILD_INDEX_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: node scripts/build-index.js
      - name: Commit index if changed
        run: |
          if git diff --quiet -- index/; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "media-time-markers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index/
          git commit -m "chore: rebuild index"
          git push
